name: Runtime RC Sync

on:
  push:
    branches:
      - 'runtime-1.0.0-rc.*-sync'
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm install
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
